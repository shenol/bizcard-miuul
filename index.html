<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shenol Mustafa | Dijital Kartvizit</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 40px 32px;
    text-align: center;
  }

  .avatar {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #14213d;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .name {
    font-size: 22px;
    font-weight: 700;
    color: #14213d;
    margin-bottom: 4px;
  }

  .title {
    font-size: 15px;
    color: #14213d;
    opacity: 0.75;
    margin-bottom: 2px;
  }

  .company {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 24px;
  }

  .divider {
    height: 1px;
    background: #e5e7eb;
    margin-bottom: 24px;
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
    text-align: left;
  }

  .contact a {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #14213d;
    text-decoration: none;
    font-size: 14px;
  }

  .contact a:hover {
    text-decoration: underline;
  }

  .icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    color: #14213d;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .socials a {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #f4f6f8;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #14213d;
    transition: background 0.2s ease;
  }

  .socials a:hover {
    background: #e5e7eb;
  }

  .socials svg {
    width: 18px;
    height: 18px;
  }

  #root {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .qr-card {
    width: 100%;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .qr-label {
    font-size: 13px;
    color: #6b7280;
  }

  .qr-code canvas,
  .qr-code img {
    display: block;
    border-radius: 8px;
  }

  .form-card {
    width: 100%;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .form-title {
    font-size: 15px;
    font-weight: 600;
    color: #14213d;
    text-align: center;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
  }

  .form-field label {
    font-size: 13px;
    color: #6b7280;
  }

  .form-field input {
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: #14213d;
    outline: none;
  }

  .form-field input:focus {
    border-color: #14213d;
  }

  .form-submit {
    margin-top: 4px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #14213d;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .form-submit:hover {
    opacity: 0.9;
  }

  .form-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .form-message {
    font-size: 13px;
    text-align: center;
  }

  .form-message.success {
    color: #15803d;
  }

  .form-message.error {
    color: #b91c1c;
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- Kurulum gerektirmez: React, ReactDOM, Babel standalone ve QR kod kütüphanesi CDN üzerinden yüklenir. -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

// Kart yayına alındığında bu adresi güncelleyin (GitHub Pages URL'i).
const LIVE_URL = "https://shenol.github.io/bizcard-miuul/";

// "Kartı Kaydet" formu bu n8n webhook'una gönderim yapar.
const WEBHOOK_URL = "https://n8n.rnhy.net/webhook/biz-card";

const ICONS = {
  phone: (
    <svg className="icon" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
      <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 0 1 2-2h3.28a1 1 0 0 1 .95.68l1.5 4.5a1 1 0 0 1-.27 1.05L9 10.5a11 11 0 0 0 4.5 4.5l1.27-1.46a1 1 0 0 1 1.05-.27l4.5 1.5a1 1 0 0 1 .68.95V19a2 2 0 0 1-2 2h-1C10.5 21 3 13.5 3 6V5Z" />
    </svg>
  ),
  mail: (
    <svg className="icon" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
      <path strokeLinecap="round" strokeLinejoin="round" d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" />
      <path strokeLinecap="round" strokeLinejoin="round" d="m3 6 9 7 9-7" />
    </svg>
  ),
  website: (
    <svg className="icon" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" strokeLinecap="round" strokeLinejoin="round" />
      <path strokeLinecap="round" strokeLinejoin="round" d="M3 12h18M12 3c2.5 2.5 3.75 5.5 3.75 9S14.5 18.5 12 21c-2.5-2.5-3.75-5.5-3.75-9S9.5 5.5 12 3Z" />
    </svg>
  ),
  linkedin: (
    <svg fill="currentColor" viewBox="0 0 24 24">
      <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45Z" />
    </svg>
  ),
  instagram: (
    <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5" />
      <circle cx="12" cy="12" r="4" />
      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
    </svg>
  ),
};

function Avatar({ initials }) {
  return <div className="avatar">{initials}</div>;
}

function ContactList({ items, variant = "rows" }) {
  if (variant === "icons") {
    return (
      <div className="socials">
        {items.map((item) => (
          <a key={item.label} href={item.href} target="_blank" rel="noopener" aria-label={item.label}>
            {ICONS[item.icon]}
          </a>
        ))}
      </div>
    );
  }

  return (
    <div className="contact">
      {items.map((item) => (
        <a key={item.label} href={item.href} target={item.external ? "_blank" : undefined} rel={item.external ? "noopener" : undefined}>
          {ICONS[item.icon]}
          <span>{item.label}</span>
        </a>
      ))}
    </div>
  );
}

function CardQRCode({ value, size = 140 }) {
  const containerRef = useRef(null);

  useEffect(() => {
    containerRef.current.innerHTML = "";
    new window.QRCode(containerRef.current, {
      text: value,
      width: size,
      height: size,
      colorDark: "#14213d",
      colorLight: "#ffffff",
      correctLevel: window.QRCode.CorrectLevel.M,
    });
  }, [value, size]);

  return <div className="qr-code" ref={containerRef}></div>;
}

function SaveCardForm({ cardOwner }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState("idle"); // idle | sending | success | error

  const handleSubmit = async (event) => {
    event.preventDefault();
    setStatus("sending");

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name,
          email,
          cardOwner,
          submittedAt: new Date().toISOString(),
        }),
      });

      if (!response.ok) throw new Error("request failed");

      setStatus("success");
      setName("");
      setEmail("");
    } catch (error) {
      setStatus("error");
    }
  };

  return (
    <form className="form-card" onSubmit={handleSubmit}>
      <div className="form-title">Bilgilerini bırak, kartı sana kaydedelim</div>

      <div className="form-field">
        <label htmlFor="visitor-name">Ad Soyad</label>
        <input
          id="visitor-name"
          type="text"
          value={name}
          onChange={(event) => setName(event.target.value)}
          placeholder="Adınız Soyadınız"
          required
        />
      </div>

      <div className="form-field">
        <label htmlFor="visitor-email">E-posta</label>
        <input
          id="visitor-email"
          type="email"
          value={email}
          onChange={(event) => setEmail(event.target.value)}
          placeholder="ornek@eposta.com"
          required
        />
      </div>

      <button className="form-submit" type="submit" disabled={status === "sending"}>
        {status === "sending" ? "Gönderiliyor..." : "Kartı Kaydet"}
      </button>

      {status === "success" && (
        <div className="form-message success">Kaydedildi, teşekkürler!</div>
      )}
      {status === "error" && (
        <div className="form-message error">Bir şeyler ters gitti, lütfen tekrar deneyin.</div>
      )}
    </form>
  );
}

function ProfileCard({ profile }) {
  return (
    <div className="card">
      <Avatar initials={profile.initials} />

      <div className="name">{profile.name}</div>
      <div className="title">{profile.title}</div>
      <div className="company">{profile.company}</div>

      <div className="divider"></div>

      <ContactList items={profile.contacts} />
      <ContactList items={profile.socials} variant="icons" />
    </div>
  );
}

const profile = {
  initials: "SH",
  name: "Shenol Mustafa",
  title: "Co-founder",
  company: "LTS CONSULTING",
  contacts: [
    { icon: "phone", label: "+90 537 659 44 99", href: "tel:+905376594499" },
    { icon: "mail", label: "shenol@lts.bg", href: "mailto:shenol@lts.bg" },
    { icon: "website", label: "www.lts.bg", href: "https://www.lts.bg", external: true },
  ],
  socials: [
    { icon: "linkedin", label: "LinkedIn", href: "https://www.linkedin.com/in/shenol" },
    { icon: "instagram", label: "Instagram", href: "https://www.instagram.com/shenol" },
  ],
};

function App() {
  return (
    <>
      <ProfileCard profile={profile} />
      <div className="qr-card">
        <div className="qr-label">Kartviziti telefonla taratın</div>
        <CardQRCode value={LIVE_URL} size={140} />
      </div>
      <SaveCardForm cardOwner={profile.name} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
